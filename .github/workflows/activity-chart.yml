
name: Update contribution chart

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: contribution-chart
  cancel-in-progress: false

jobs:
  chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution charts
        uses: dturovskiy/deus-commit-chart@v1.5.3
        with:
          source: github
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          default-days: "30"
          ranges: "30,90,365"
          layout: spacious
          output-dir: activity-dist

      - name: Publish charts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          git clone --depth 1 --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" publish

          cd publish

          git checkout --orphan activity-assets
          git rm -rf . || true

          cp -r ../activity-dist/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Update contribution charts"
          git push origin HEAD:activity-assets --force
